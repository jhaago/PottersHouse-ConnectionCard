name: iOS Xcode 15 Compatibility Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-xcode15-compat

jobs:
  build-ios-xcode15:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select an installed Xcode 15 release
        run: |
          set -e
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_15*.app' | sort -V | tail -1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 15 installation was found on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor 6 dependencies
        run: npm install --no-audit --no-fund

      - name: Show Capacitor version
        run: npx cap --version

      - name: Prepare bundled app files
        run: npm run prepare:native

      - name: Create iOS project
        run: |
          rm -rf ios
          npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Apply app icon
        run: npm run apply:native-icons

      - name: Build iOS Simulator app with Xcode 15
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build/ios-build.log

      - name: Package simulator app
        run: |
          APP_PATH="build/ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/ConnectionCard-Xcode15-Simulator.app.zip

      - name: Package generated Xcode workspace
        run: |
          test -d ios/App/App.xcworkspace
          test -d ios/App/Pods
          ditto -c -k --sequesterRsrc --keepParent ios build/ConnectionCard-Xcode15-Project.zip

      - name: Upload Xcode 15 compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: connection-card-ios-xcode15
          path: |
            build/ConnectionCard-Xcode15-Simulator.app.zip
            build/ConnectionCard-Xcode15-Project.zip
            build/ios-build.log
          retention-days: 90
