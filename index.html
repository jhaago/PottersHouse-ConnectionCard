<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Connection Card">
  <title>Potter's House Connection Card</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">THE POTTER'S HOUSE</div>
      <h1>Connection Card</h1>
    </div>
    <div id="statusPill" class="status-pill">Offline ready</div>
  </header>

  <main>
    <section id="formView" class="view active">
      <div class="card intro">
        <h2>New connection</h2>
        <p>Save now. Sync later when internet is available.</p>
      </div>

      <form id="connectionForm" class="card form-card">
        <label>Name *<input id="name" required autocomplete="name"></label>
        <label>Phone<input id="phone" inputmode="tel" autocomplete="tel"></label>
        <label>Email<input id="email" inputmode="email" autocomplete="email"></label>
        <label>Address / area<input id="address" autocomplete="street-address"></label>

        <div class="two-col">
          <label>Age<input id="age" type="number" inputmode="numeric" min="0" max="120"></label>
          <label>First-time decision?
            <select id="firstTimeDecision">
              <option value="">Not recorded</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </label>
        </div>

        <label>Connected by<input id="recordedBy" placeholder="Your name"></label>
        <label>Notes<textarea id="notes" rows="4" placeholder="Anything useful for follow-up..."></textarea></label>

        <label class="check-row">
          <input id="permissionToContact" type="checkbox">
          <span>Person has agreed that the local church may contact them</span>
        </label>

        <button class="primary" type="submit">SAVE CONNECTION</button>
      </form>
    </section>

    <section id="entriesView" class="view">
      <div class="card entries-head">
        <div>
          <h2>Saved entries</h2>
          <p id="entriesSummary">0 saved</p>
        </div>
        <button id="syncButton" class="secondary" type="button">SYNC NOW</button>
      </div>
      <div id="entriesList" class="entries-list"></div>
      <div id="emptyState" class="card empty-state">No entries yet.</div>
    </section>

    <section id="settingsView" class="view">
      <div class="card settings-card">
        <h2>Settings</h2>
        <label>Your name<input id="defaultRecorder" placeholder="Used for Connected by"></label>
        <label>Google sync URL<input id="syncUrl" inputmode="url" placeholder="Apps Script web app URL"></label>
        <p class="help">You only need to set this once on each phone.</p>
        <button id="saveSettings" class="primary" type="button">SAVE SETTINGS</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-view="formView" class="nav-button active"><span class="nav-icon">＋</span><span>New</span></button>
    <button data-view="entriesView" class="nav-button"><span id="queueBadge" class="badge hidden">0</span><span class="nav-icon">☰</span><span>Entries</span></button>
    <button data-view="settingsView" class="nav-button"><span class="nav-icon">⚙</span><span>Settings</span></button>
  </nav>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
